name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy containers
        env:
          PERSISTENT_APP_DIR: /home/quant-intelligence/Desktop/github/Non-ProfessionalFormula-
          ENV_FILE: /home/quant-intelligence/Desktop/github/Non-ProfessionalFormula-/.env
          LOGS_DIR: /home/quant-intelligence/Desktop/github/Non-ProfessionalFormula-/logs
        run: |
          set -x
          pwd
          id
          ls -la
          ls -la "$PERSISTENT_APP_DIR"
          if [ ! -f "$ENV_FILE" ] && [ -f "${PERSISTENT_APP_DIR}/env" ]; then
            export ENV_FILE="${PERSISTENT_APP_DIR}/env"
          fi
          test -f "$ENV_FILE"
          docker version
          docker compose version
          bash ./deploy/redeploy.sh
