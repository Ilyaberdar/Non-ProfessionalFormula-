services:
  main:
    build:
      context: .
    container_name: npf-main
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_FILE: main.py
    volumes:
      - ${LOGS_DIR:-./logs}:/app/logs

  openf1:
    build:
      context: .
    container_name: npf-openf1
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_FILE: openf1_top10_poster.py
    volumes:
      - ${LOGS_DIR:-./logs}:/app/logs
